services:
  api:
    build: .
    image: medevidence-copilot:latest
    command: ["python", "app/server.py"]
    env_file: .env
    environment:
      MEDEVIDENCE_MODE: agent
      RATE_LIMIT_PER_MIN: "10"
      RATE_LIMIT_BURST: "5"
      CACHE_TTL_S: "3600"
    volumes:
      - ./data:/app/data:ro
      - ./certs:/app/certs:ro
      - medevidence-cache:/app/.cache
      - ./results/traces:/app/results/traces
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  ui:
    image: medevidence-copilot:latest
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8100
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  medevidence-cache:
